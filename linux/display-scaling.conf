# Display scaling for HiDPI/mixed-DPI setups
# Provides 0.5x scaling globally on X11

# GTK 3/4 applications
# GDK_SCALE only accepts integers, so we use GDK_SCALE=1 with GDK_DPI_SCALE=0.5
# This gives effective 0.5x scaling (1 * 0.5 = 0.5)
GDK_SCALE=1
GDK_DPI_SCALE=1.1

# Qt applications (KDE apps, VLC, etc.)
QT_AUTO_SCREEN_SCALE_FACTOR=0
QT_SCALE_FACTOR=1.1
QT_FONT_DPI=48

# Electron applications (VS Code, Spotify, Discord, Slack, etc.)
ELECTRON_FORCE_DEVICE_SCALE_FACTOR=1.2
